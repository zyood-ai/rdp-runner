name: Cloud Server Runner (RDP and VPS)

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Server OS (Windows or Linux Distros)'
        required: false
        default: 'windows-2022'
      ram_size:
        description: 'RAM Configuration'
        required: false
        default: '16GB'
      ngrok_token:
        description: 'Ngrok Auth Token'
        required: false
        default: ''
      ngrok_region:
        description: 'Ngrok Region'
        required: false
        default: 'eu'

jobs:
  rdp-setup:
    if: "startsWith(inputs.windows_version, 'windows') || inputs.windows_version == ''"
    runs-on: ${{ inputs.windows_version != '' && inputs.windows_version || 'windows-2022' }}
    timeout-minutes: 360 # 6 hours max runtime
    steps:
      - name: Download and extract Ngrok v3
        shell: pwsh
        run: |
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          Remove-Item ngrok.zip
          Copy-Item .\ngrok.exe C:\Windows\System32\ngrok.exe -Force

      - name: Optimize Disk and Configure RAM
        shell: pwsh
        run: |
          $ramChoice = "${{ inputs.ram_size }}"
          Write-Output "[*] Target RAM Configuration: $ramChoice"
          
          if ($ramChoice -eq "32GB" -or $ramChoice -eq "64GB") {
            $pageMB = if ($ramChoice -eq "64GB") { 57344 } else { 24576 }
            try {
              Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $false} -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'PagingFiles' -Value @("C:\pagefile.sys $pageMB $pageMB") -ErrorAction SilentlyContinue
              Write-Output "[+] Virtual memory pagefile configured for $pageMB MB"
            } catch {}
          }
          
          Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue
          $freeGB = [Math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "[+] Free SSD Space on C:: $freeGB GB"

      - name: Enable RDP and Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fPromptForPassword" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force
          
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fDisableUDP" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "LmCompatibilityLevel" -Value 2 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters" -Name "BlockNTLM" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force
          
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue

          $ready = $false
          for ($i = 0; $i -lt 15; $i++) {
            $test = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
            if ($test.TcpTestSucceeded) {
              Write-Output "[+] TermService is listening on 127.0.0.1:3389!"
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Restart-Service -Name "TermService" -Force
            Start-Sleep -Seconds 2
          }

      - name: Create Admin User
        shell: pwsh
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0").replace("MinimumPasswordLength = 8", "MinimumPasswordLength = 0") | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue

          cmd.exe /c "net user Fazah Fazah@123 /add /expires:never /active:yes"
          cmd.exe /c "net localgroup Administrators Fazah /add"
          cmd.exe /c "net localgroup `"Remote Desktop Users`" Fazah /add"
          cmd.exe /c "net user runneradmin Fazah@123 /active:yes"

      - name: Configure and Start Ngrok Tunnel
        id: ngrok-tunnel
        shell: pwsh
        env:
          DEFAULT_NGROK: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $tok = "${{ inputs.ngrok_token }}"
          if (-not $tok) { $tok = $env:DEFAULT_NGROK }
          $reg = "${{ inputs.ngrok_region }}"
          if (-not $reg -or $reg -eq "gb") { $reg = "eu" }

          @(
            'version: "2"',
            "authtoken: $tok",
            "region: $reg",
            'tunnels:',
            '  rdp:',
            '    proto: tcp',
            '    addr: 127.0.0.1:3389'
          ) | Out-File -FilePath "C:\ngrok.yml" -Encoding ascii

          Write-Output "[*] Installing Ngrok Windows Service..."
          C:\Windows\System32\ngrok.exe service install --config="C:\ngrok.yml"
          C:\Windows\System32\ngrok.exe service start

          $tunnelUrl = $null
          $timeout = 20
          while ($timeout -gt 0 -and -not $tunnelUrl) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $tcp = $response.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
              if ($tcp) {
                $tunnelUrl = $tcp.public_url -replace "^tcp://", ""
              }
            } catch {}
            $timeout--
          }

          if ($tunnelUrl) {
            Write-Output "[+] RDP Public Address: $tunnelUrl"
            echo "tunnel_url=$tunnelUrl" >> $env:GITHUB_OUTPUT
            echo "TUNNEL_HOST=$tunnelUrl" >> $env:GITHUB_ENV
          } else {
            Write-Output "[!] Failed to get tunnel URL within timeout."
            exit 1
          }

      - name: Build and Upload .rdp Artifact
        shell: pwsh
        run: |
          @(
            "full address:s:${{ env.TUNNEL_HOST }}",
            "username:s:Fazah",
            "prompt for credentials:i:1",
            "administrative session:i:1",
            "authentication level:i:0",
            "enablecredsspsupport:i:0",
            "autoreconnection enabled:i:1",
            "smart sizing:i:1",
            "screen mode id:i:2",
            "desktopwidth:i:1920",
            "desktopheight:i:1080",
            "redirectclipboard:i:1"
          ) | Out-File -FilePath rdp-connection.rdp -Encoding ascii

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-connection
          path: rdp-connection.rdp
          retention-days: 1

      - name: Keep Alive Session
        shell: pwsh
        env:
          TUNNEL_HOST: ${{ steps.ngrok-tunnel.outputs.tunnel_url }}
        run: |
          Write-Output "[+] RDP is now live ($env:TUNNEL_HOST)! Keeping runner alive..."
          while ($true) {
            $svc = Get-Service -Name "ngrok" -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne "Running") {
              Write-Output "[!] Ngrok service stopped. Restarting service..."
              Start-Service -Name "ngrok" -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 120
          }

      - name: Cleanup Ngrok
        if: always()
        shell: pwsh
        run: |
          C:\Windows\System32\ngrok.exe service stop -ErrorAction SilentlyContinue
          C:\Windows\System32\ngrok.exe service uninstall -ErrorAction SilentlyContinue

  vps-setup:
    if: "!startsWith(inputs.windows_version, 'windows') && inputs.windows_version != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max runtime
    steps:
      - name: Optimize Disk and Configure RAM Swap
        run: |
          ramChoice="${{ inputs.ram_size }}"
          echo "[*] Target VPS RAM: $ramChoice"
          sudo rm -rf /opt/hostedtoolcache &
          if [ "$ramChoice" = "32GB" ] || [ "$ramChoice" = "64GB" ] || [ "$ramChoice" = "16GB" ]; then
            swapGB=8
            if [ "$ramChoice" = "32GB" ]; then swapGB=24; fi
            if [ "$ramChoice" = "64GB" ]; then swapGB=56; fi
            echo "[*] Configuring ${swapGB}GB swap space..."
            sudo swapoff -a || true
            sudo rm -f /swapfile || true
            if sudo fallocate -l ${swapGB}G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((swapGB * 1024)) 2>/dev/null; then
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
              echo "[+] Swap configured successfully!"
            fi
          fi
          free -h

      - name: Install and Extract Ngrok v3
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -C /usr/local/bin -xz
          sudo chmod +x /usr/local/bin/ngrok
          tok="${{ inputs.ngrok_token }}"
          if [ -z "$tok" ]; then tok="${{ secrets.NGROK_AUTH_TOKEN }}"; fi
          ngrok config add-authtoken "$tok"

      - name: Setup GUI Desktop and XRDP
        if: "endsWith(inputs.windows_version, '-gui') || inputs.windows_version == 'android-cloud' || inputs.windows_version == 'ai-dev'"
        run: |
          TARGET_OS="${{ inputs.windows_version }}"
          echo "[+] Installing XFCE Desktop & XRDP with Xorg driver for $TARGET_OS..."
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal xrdp xorgxrdp dbus-x11 x11-xserver-utils python3-tk curl wget nano
          
          echo "runner:Fazah@123" | sudo chpasswd
          echo "root:Fazah@123" | sudo chpasswd
          sudo adduser xrdp ssl-cert
          sudo adduser runner ssl-cert
          
          # Prevent Polkit Color Manager authorization crash in headless session
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d
          cat << 'EOF' | sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla > /dev/null
          [Allow Colord all Users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          EOF
          
          # Clean Xsession
          echo "startxfce4" > /home/runner/.xsession
          chmod +x /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession
          
          # Overwrite /etc/xrdp/startwm.sh to guarantee clean DBus session and prevent session crash
          cat << 'EOF' | sudo tee /etc/xrdp/startwm.sh > /dev/null
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Configure auto-login in XRDP for runner so user connects directly without grey login window!
          sudo sed -i '/^\[Xorg\]/,/^\[/ s/^username=.*/username=runner/' /etc/xrdp/xrdp.ini
          sudo sed -i '/^\[Xorg\]/,/^\[/ s/^password=.*/password=Fazah@123/' /etc/xrdp/xrdp.ini

      - name: Setup GUI Custom Themes and Apps
        if: "endsWith(inputs.windows_version, '-gui') || inputs.windows_version == 'android-cloud' || inputs.windows_version == 'ai-dev'"
        run: |
          TARGET_OS="${{ inputs.windows_version }}"
          export TARGET_OS
          echo "" | base64 -d | sudo -E python3 -
          
          if [ "$TARGET_OS" = "kali-gui" ]; then
            echo "[*] Installing Complete Official Kali Offensive Suite..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              nmap wireshark tshark aircrack-ng hydra john sqlmap netcat-traditional \
              nikto dirb gobuster wfuzz hashcat tcpdump binwalk foremost testdisk steghide radare2 gdb || true
            sudo mkdir -p /usr/share/wordlists
            curl -sSL "https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt" -o /usr/share/wordlists/rockyou.txt || true
          elif [ "$TARGET_OS" = "parrot-gui" ]; then
            echo "[*] Installing Parrot Tools..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              nmap sqlmap wireshark nikto dirb netcat-traditional aircrack-ng || true
          elif [ "$TARGET_OS" = "android-cloud" ]; then
            echo "[*] Configuring Android Virtual System..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              adb fastboot scrcpy openjdk-17-jdk || true
            echo "" | base64 -d | sudo tee /usr/local/bin/android_phone.py > /dev/null
            sudo chmod +x /usr/local/bin/android_phone.py
          elif [ "$TARGET_OS" = "ai-dev" ]; then
            echo "[*] Configuring AI Studio (JupyterLab)..."
            sudo apt-get install -y python3-pip python3-venv git curl || true
            python3 -m pip install --break-system-packages --no-cache-dir jupyterlab numpy pandas matplotlib || true
            nohup jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='Fazah@123' --allow-root > /tmp/jupyter.log 2>&1 &
            python3 -m pip install --break-system-packages --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu > /dev/null 2>&1 &
          fi
          
          # Setup autostart apps for each OS
          mkdir -p /home/runner/.config/autostart
          if [ "$TARGET_OS" = "android-cloud" ]; then
            cat << 'EOF' | sudo tee /home/runner/.config/autostart/android.desktop > /dev/null
[Desktop Entry]
Type=Application
Name=Android Phone
Exec=python3 /usr/local/bin/android_phone.py
Hidden=false
NoDisplay=false
X-GNOME-Autostart-enabled=true
EOF
          elif [ "$TARGET_OS" = "ai-dev" ]; then
            cat << 'EOF' | sudo tee /home/runner/.config/autostart/ai.desktop > /dev/null
[Desktop Entry]
Type=Application
Name=JupyterLab
Exec=x-www-browser "http://127.0.0.1:8888/lab?token=Fazah@123"
Hidden=false
NoDisplay=false
X-GNOME-Autostart-enabled=true
EOF
          elif [ "$TARGET_OS" = "kali-gui" ]; then
            cat << 'EOF' | sudo tee /home/runner/.config/autostart/kali.desktop > /dev/null
[Desktop Entry]
Type=Application
Name=Kali Offensive Suite
Exec=xfce4-terminal --title="🐉 Kali Linux Suite" --geometry=110x32 --command="bash -c 'clear; echo "========================================================================="; echo "  🐉 KALI LINUX OFFICIAL OFFENSIVE SUITE (ROOT / RUNNER)"; echo "========================================================================="; echo "  [+] Operating System : Kali Linux Security Desktop (64-bit)"; echo "  [+] User Privileges  : runner (sudo / root access)"; echo "  [+] Password         : Fazah@123"; echo "  [+] Desktop Theme    : Authentic Glowing Kali Dragon Wallpaper"; echo "  [+] Wordlists        : /usr/share/wordlists/rockyou.txt"; echo "-------------------------------------------------------------------------"; echo "  [⚔️] Preinstalled & Ready Offensive Security Arsenal:"; echo "       • Network     : Nmap, Wireshark, Tshark, Netcat, TCPDump"; echo "       • Passwords   : John The Ripper, THC Hydra, Hashcat"; echo "       • Web & Apps  : SQLMap, Nikto, Dirb, Gobuster, Wfuzz"; echo "       • Wireless    : Aircrack-ng Suite"; echo "       • Forensics   : Binwalk, Foremost, Testdisk, Steghide, Radare2"; echo "========================================================================="; exec bash'"
Hidden=false
NoDisplay=false
X-GNOME-Autostart-enabled=true
EOF
          elif [ "$TARGET_OS" = "parrot-gui" ]; then
            cat << 'EOF' | sudo tee /home/runner/.config/autostart/parrot.desktop > /dev/null
[Desktop Entry]
Type=Application
Name=Parrot Cyber Suite
Exec=xfce4-terminal --title="🦜 Parrot Security OS" --command="bash -c 'clear; echo "==================================================="; echo " 🦜 PARROT SECURITY DESKTOP"; echo "==================================================="; echo " [+] AnonSurf & Cyber Tools Ready"; echo "==================================================="; exec bash'"
Hidden=false
NoDisplay=false
X-GNOME-Autostart-enabled=true
EOF
          fi
          
          sudo chown -R runner:runner /home/runner/Desktop /home/runner/.config /home/runner/.xsession 2>/dev/null || true
          sudo systemctl restart xrdp-sesman || sudo service xrdp-sesman restart || true
          sudo systemctl restart xrdp || sudo service xrdp restart || true
          echo "TARGET_PORT=3389" >> $GITHUB_ENV
      - name: Setup Native Ubuntu VPS SSH
        if: "startsWith(inputs.windows_version, 'ubuntu') && !endsWith(inputs.windows_version, '-gui') && inputs.windows_version != 'android-cloud' && inputs.windows_version != 'ai-dev'"
        run: |
          echo "[+] Configuring Native Ubuntu host SSH..."
          echo "root:Fazah@123" | sudo chpasswd
          echo "runner:Fazah@123" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin no/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart
          echo 'echo "========================================================="' >> /home/runner/.bashrc
          echo 'echo " 🐧 Welcome to Ubuntu Linux VPS (Root Access)"' >> /home/runner/.bashrc
          echo 'echo " [+] Physical Native Performance | 2Gbps Connection Ready"' >> /home/runner/.bashrc
          echo 'echo "========================================================="' >> /home/runner/.bashrc
          echo "TARGET_PORT=22" >> $GITHUB_ENV

      - name: Setup Containerized Distro VPS SSH
        if: "!startsWith(inputs.windows_version, 'ubuntu') && !endsWith(inputs.windows_version, '-gui') && inputs.windows_version != 'android-cloud' && inputs.windows_version != 'ai-dev'"
        run: |
          TARGET_OS="${{ inputs.windows_version }}"
          echo "[+] Preparing Containerized VPS for: $TARGET_OS"
          DOCKER_IMG="debian:12"
          
          if [[ "$TARGET_OS" =~ ^debian ]]; then
            DOCKER_IMG="debian:12"
            echo "" | base64 -d > /tmp/setup.sh
          elif [[ "$TARGET_OS" =~ ^kali ]]; then
            DOCKER_IMG="kalilinux/kali-rolling"
            echo "" | base64 -d > /tmp/setup.sh
          elif [[ "$TARGET_OS" =~ ^alpine ]]; then
            DOCKER_IMG="alpine:latest"
            echo "" | base64 -d > /tmp/setup.sh
          elif [[ "$TARGET_OS" =~ ^arch ]]; then
            DOCKER_IMG="archlinux:latest"
            echo "" | base64 -d > /tmp/setup.sh
          elif [[ "$TARGET_OS" =~ ^fedora ]]; then
            DOCKER_IMG="fedora:40"
            echo "" | base64 -d > /tmp/setup.sh
          elif [[ "$TARGET_OS" =~ ^rocky ]]; then
            DOCKER_IMG="rockylinux:9"
            echo "" | base64 -d > /tmp/setup.sh
          fi

          chmod +x /tmp/setup.sh
          echo "[*] Pulling and launching $DOCKER_IMG container on host port 2222..."
          docker run -d --name vps --privileged -p 2222:22 -v /tmp/setup.sh:/setup.sh "$DOCKER_IMG" sh /setup.sh
          echo "TARGET_PORT=2222" >> $GITHUB_ENV

      - name: Wait for Service Port to be Live
        run: |
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi
          echo "[*] Waiting for service on port $port (up to 90 seconds)..."
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 $port 2>/dev/null || (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
              echo "[+] Service is LIVE on port $port! (Ready in ${i}s)"
              break
            fi
            if [ "$i" -eq 30 ] || [ "$i" -eq 60 ]; then
              echo "[*] Still starting (${i}s)... Recent container logs:"
              docker logs vps --tail 5 2>/dev/null || true
            fi
            sleep 1
          done

      - name: Configure and Start Ngrok Tunnel
        id: ngrok-tunnel
        run: |
          reg="${{ inputs.ngrok_region }}"
          if [ -z "$reg" ] || [ "$reg" = "gb" ]; then reg="eu"; fi
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi
          echo "[*] Starting Ngrok TCP tunnel for port $port on region $reg..."
          nohup ngrok tcp "$port" --region "$reg" --log=stdout > /tmp/ngrok.log 2>&1 & disown
          sleep 3
          tunnel_url=""
          for i in $(seq 1 25); do
            tunnel_url=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n1 | sed 's|tcp://||')
            if [ -n "$tunnel_url" ]; then
              break
            fi
            sleep 2
          done
          if [ -n "$tunnel_url" ]; then
            echo "tunnel_url=$tunnel_url" >> $GITHUB_OUTPUT
            echo "[+] Tunnel URL: $tunnel_url"
          else
            echo "[!] Failed to get tunnel URL"
            cat /tmp/ngrok.log 2>/dev/null || true
            exit 1
          fi

      - name: Build Connection Artifact
        run: |
          url="${{ steps.ngrok-tunnel.outputs.tunnel_url }}"
          port="${{ env.TARGET_PORT }}"
          user_name="runner"
          if [[ "${{ inputs.windows_version }}" =~ ^windows ]]; then user_name="Fazah"; fi
          
          echo "full address:s:$url" > rdp-connection.rdp
          echo "username:s:$user_name" >> rdp-connection.rdp
          echo "prompt for credentials:i:1" >> rdp-connection.rdp
          echo "administrative session:i:1" >> rdp-connection.rdp
          echo "authentication level:i:0" >> rdp-connection.rdp
          echo "enablecredsspsupport:i:0" >> rdp-connection.rdp
          echo "autoreconnection enabled:i:1" >> rdp-connection.rdp
          echo "smart sizing:i:1" >> rdp-connection.rdp
          echo "screen mode id:i:2" >> rdp-connection.rdp
          echo "desktopwidth:i:1920" >> rdp-connection.rdp
          echo "desktopheight:i:1080" >> rdp-connection.rdp
          echo "redirectclipboard:i:1" >> rdp-connection.rdp
          echo "$url" >> rdp-connection.rdp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-connection
          path: rdp-connection.rdp
          retention-days: 1

      - name: Keep Alive Session
        run: |
          echo "[+] Server session is live (${{ steps.ngrok-tunnel.outputs.tunnel_url }})! Keeping session active..."
          reg="${{ inputs.ngrok_region }}"
          if [ -z "$reg" ] || [ "$reg" = "gb" ]; then reg="eu"; fi
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi
          while true; do
            if ! pgrep -x "ngrok" > /dev/null; then
              echo "[!] Ngrok stopped. Restarting tunnel..."
              nohup ngrok tcp "$port" --region "$reg" --log=stdout > /tmp/ngrok.log 2>&1 & disown
            fi
            sleep 60
          done
